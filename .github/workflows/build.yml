name: Verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and bundled assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q tests

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and lint frontend
        working-directory: frontend
        run: |
          npm run build
          npm run lint

  build-windows:
    name: Package Windows
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source and bundled assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies and build frontend
        run: |
          python -m pip install -r requirements.txt
          cd frontend
          npm ci
          npm run build

      - name: Package application
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name "Clip Assassin"
          --icon icon.ico
          --add-data "frontend/dist;frontend/dist"
          --add-data "presets;presets"
          --add-data "templates;templates"
          --collect-all webview
          --collect-all keyring
          --collect-all uvicorn
          --collect-all fastapi
          --hidden-import modules.master_ingest
          --hidden-import modules.audio_tools
          --hidden-import modules.export_tools
          --hidden-import modules.magic_tools
          --hidden-import modules.timeline_tools
          --hidden-import modules.utility_tools
          --hidden-import modules.badwords_tools
          --hidden-import resolve_core
          --hidden-import db
          --hidden-import config
          --hidden-import logger
          --hidden-import exceptions
          --hidden-import task_queue
          --hidden-import ai_integration
          --hidden-import plugin_system
          desktop_app.py

      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path 'dist/Clip Assassin/*','README.md','CHANGELOG.md' -DestinationPath 'Clip-Assassin-Windows.zip'

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Clip-Assassin-Windows.zip

  build-macos:
    name: Package macOS
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Check out source and bundled assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies and build frontend
        run: |
          python -m pip install -r requirements.txt
          cd frontend
          npm ci
          npm run build

      - name: Package application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name "Clip Assassin"
          --icon app_icon.icns
          --add-data "frontend/dist:frontend/dist"
          --add-data "presets:presets"
          --add-data "templates:templates"
          --collect-all webview
          --collect-all keyring
          --collect-all uvicorn
          --collect-all fastapi
          --hidden-import modules.master_ingest
          --hidden-import modules.audio_tools
          --hidden-import modules.export_tools
          --hidden-import modules.magic_tools
          --hidden-import modules.timeline_tools
          --hidden-import modules.utility_tools
          --hidden-import modules.badwords_tools
          --hidden-import resolve_core
          --hidden-import db
          --hidden-import config
          --hidden-import logger
          --hidden-import exceptions
          --hidden-import task_queue
          --hidden-import ai_integration
          --hidden-import plugin_system
          desktop_app.py

      - name: Create macOS archive
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Clip Assassin.app" "Clip-Assassin-macOS.zip"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: Clip-Assassin-macOS.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Download macOS archive
        uses: actions/download-artifact@v4
        with:
          name: macos-release

      - name: Publish release with platform builds
        uses: softprops/action-gh-release@v2
        with:
          name: Clip Assassin ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Clip-Assassin-Windows.zip
            Clip-Assassin-macOS.zip
